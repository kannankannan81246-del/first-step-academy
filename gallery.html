<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gallery | First Step Academy</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f5f8fb;color:#243247}
header{background:#142b4a;color:white;padding:20px}
nav a{color:white;text-decoration:none;margin:10px;font-weight:bold}
main{max-width:1000px;margin:35px auto;padding:15px}
h1{color:#142b4a}
.gallery-box{background:white;padding:35px;border-radius:14px;text-align:center;border:1px dashed #20a596;margin-top:25px}
</style>
<style>
:root{--navy:#102541;--gold:#b58a3a;--ink:#243247;--muted:#718096;--paper:#f5f6f8;--line:#e7e1d5}
body{font-family:Inter,"Segoe UI",Arial,sans-serif;background:#fff;color:var(--ink);line-height:1.7}
header{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.96);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);box-shadow:0 5px 24px rgba(16,37,65,.06)}
header h2{color:var(--navy)}
nav a{color:var(--navy)!important;text-decoration:none;font-weight:700;padding:8px 11px;border-radius:9px;display:inline-block}
nav a:hover{background:#f5f0e6;color:#8b672d!important}
h1,h2,h3{color:var(--navy)}
main{width:min(1100px,92%);margin:36px auto}
.group,.card,.panel,.intro,.empty,.gallery-box{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 10px 30px rgba(16,37,65,.055)}
.hero{background:linear-gradient(125deg,#f7f8fa,#f6f1e7)}
.tag{color:#9b742e}
.btn{background:linear-gradient(135deg,#c7a45e,#9b742e);color:#fff;border:0;border-radius:11px;padding:12px 20px;font-weight:800}
footer{background:#102541;color:#e4e9ef;padding:26px 0}
@media(max-width:720px){header nav{display:flex;overflow-x:auto;white-space:nowrap;padding:4px 0 8px}header nav a{font-size:.82rem}main{margin:24px auto}.grid,.cards{grid-template-columns:1fr}}
</style><style>
:root{--navy:#102541;--gold:#b58a3a;--ink:#243247;--muted:#718096;--line:#e7e1d5}
.site-header{position:sticky;top:0;z-index:40;background:rgba(255,255,255,.97);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);box-shadow:0 5px 24px rgba(16,37,65,.06)}
.site-shell{width:min(1100px,92%);min-height:76px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:18px}
.site-brand{display:flex;align-items:center;gap:10px;color:var(--navy);font-weight:900;letter-spacing:.35px;white-space:nowrap;text-decoration:none}
.site-logo{display:grid;place-items:center;width:42px;height:42px;border-radius:13px;background:linear-gradient(135deg,#c7a45e,#9b742e);color:white;box-shadow:0 7px 16px rgba(181,138,58,.2)}
.site-links{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.site-links a{display:inline-block;padding:8px 10px;border-radius:9px;color:var(--navy);font-size:.88rem;font-weight:700;text-decoration:none;white-space:nowrap;transition:background .18s,color .18s}
.site-links a:hover,.site-links a[aria-current="page"]{background:#f5f0e6;color:#8b672d}
.site-footer{background:#102541;color:#e4e9ef;padding:26px 0;margin-top:55px}
.site-footer-inner{width:min(1100px,92%);margin:0 auto;display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap}
@media(max-width:760px){.site-shell{min-height:auto;padding:12px 0;align-items:flex-start;flex-direction:column;gap:8px}.site-links{width:100%;overflow-x:auto;flex-wrap:nowrap;padding-bottom:5px}.site-links a{font-size:.82rem}.site-footer-inner{flex-direction:column}}
</style>
<meta name="theme-color" content="#102541">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<meta name="description" content="View activities, events and special moments from First Step Academy.">
</head>
<body>
<header class="site-header"><div class="site-shell"><a class="site-brand" href="index.html"><span class="site-logo" aria-hidden="true">F</span><span>FIRST STEP ACADEMY</span></a><nav class="site-links" aria-label="Primary navigation"><a href="index.html">Home</a><a href="courses.html">Courses</a><a href="about.html">About</a><a href="achievements.html">Achievements</a><a href="gallery.html" aria-current="page">Gallery</a><a href="contact.html">Contact</a><a href="portal.html">Portal</a></nav></div></header>
<main>
<section class="hero" style="padding:34px;border-radius:20px">
  <span class="tag"><b>FIRST STEP ACADEMY</b></span>
  <h1>Our Gallery</h1>
  <p>Memories, activities and special moments at First Step Academy.</p>
</section>
<div id="galleryStatus" class="gallery-box"><h2>Loading gallery...</h2></div>
<section id="galleryGrid" class="gallery-grid" aria-live="polite"></section>
</main>
<style>
.gallery-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;margin:26px 0 45px}
.gallery-card{overflow:hidden;border:1px solid var(--line);border-radius:16px;background:#fff;box-shadow:0 10px 30px rgba(16,37,65,.07)}
.gallery-card img{display:block;width:100%;height:230px;object-fit:cover;background:#eef2f6;cursor:pointer}
.gallery-card .gallery-caption{padding:14px 16px}
.gallery-card h3{font-size:1rem;margin:0 0 4px}
.gallery-card p{font-size:.88rem;color:var(--muted);margin:0}
@media(max-width:850px){.gallery-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:560px){.gallery-grid{grid-template-columns:1fr}.gallery-card img{height:240px}}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const galleryDb=window.supabase.createClient(
  'https://zbpneflfiykvlbeolpht.supabase.co',
  'sb_publishable_-bPtNntI8dUA3hzElAtETA_4Zkqa082'
);
async function loadPublicGallery(){
  const status=document.getElementById('galleryStatus');
  const grid=document.getElementById('galleryGrid');
  const {data,error}=await galleryDb.from('gallery_photos')
    .select('caption,category,image_path,created_at')
    .eq('published',true).order('created_at',{ascending:false});
  if(error){
    status.innerHTML='<h2>Gallery is temporarily unavailable</h2><p>Please visit again later.</p>';
    return;
  }
  if(!data||!data.length){
    status.innerHTML='<h2>Gallery photos coming soon!</h2><p>Photos and special moments will appear here once published by the academy.</p>';
    return;
  }
  status.hidden=true;
  grid.innerHTML=data.map(photo=>{
    const url=galleryDb.storage.from('academy-gallery').getPublicUrl(photo.image_path).data.publicUrl;
    const caption=String(photo.caption||'').replace(/[&<>"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]));
    const category=String(photo.category||'Academy Activities').replace(/[&<>"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]));
    return '<article class="gallery-card"><img loading="lazy" src="'+url+'" alt="'+(caption||category)+'"><div class="gallery-caption"><h3>'+category+'</h3>'+(caption?'<p>'+caption+'</p>':'')+'</div></article>';
  }).join('');
}
loadPublicGallery();
</script>
<footer class="site-footer"><div class="site-footer-inner"><strong>FIRST STEP ACADEMY · Learn. Practise. Grow.</strong><span>© <span class="site-year"></span> First Step Academy</span></div></footer><script>document.querySelectorAll('.site-year').forEach(el=>el.textContent=new Date().getFullYear());</script>
</body>
</html>
