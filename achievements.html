<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Student achievements and milestones at First Step Academy.">
<title>Achievements | First Step Academy</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--navy:#102541;--gold:#b58a3a;--ink:#243247;--muted:#718096;--paper:#f5f6f8;--line:#e7e1d5}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,"Segoe UI",Arial,sans-serif;background:#fff;color:var(--ink);line-height:1.7}
header{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.96);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);box-shadow:0 5px 24px rgba(16,37,65,.06);padding:16px 4%}
header h2{margin:0 0 8px;color:var(--navy)}
nav{display:flex;gap:8px;flex-wrap:wrap}
nav a{color:var(--navy);text-decoration:none;font-weight:700;padding:8px 11px;border-radius:9px}
nav a:hover{background:#f5f0e6;color:#8b672d}
main{width:min(1100px,92%);margin:36px auto 60px}
h1,h2,h3{color:var(--navy)}
.hero{background:linear-gradient(125deg,#f7f8fa,#f6f1e7);border:1px solid var(--line);border-radius:22px;padding:34px;margin-bottom:26px}
.tag{color:#9b742e;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;font-size:.75rem}
.hero h1{font-size:clamp(2rem,5vw,3rem);margin:8px 0}
.hero p{color:var(--muted);max-width:650px}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:0 10px 30px rgba(16,37,65,.055)}
.card .date{color:#9b742e;font-weight:800;font-size:.82rem}
.card h2{font-size:1.2rem;margin:8px 0}
.card p{color:var(--muted);margin-bottom:0;white-space:pre-wrap}
.state{background:#fff;border:1px dashed #d8c9aa;border-radius:16px;padding:28px;text-align:center;color:var(--muted)}
footer{background:#102541;color:#e4e9ef;padding:26px 4%;text-align:center}
@media(max-width:760px){.cards{grid-template-columns:1fr}header nav{overflow-x:auto;flex-wrap:nowrap}nav a{white-space:nowrap;font-size:.85rem}.hero{padding:24px}}
</style>
</head>
<body>
<header>
<h2>FIRST STEP ACADEMY</h2>
<nav>
<a href="index.html">Home</a><a href="courses.html">Courses</a><a href="about.html">About</a><a href="achievements.html">Achievements</a><a href="gallery.html">Gallery</a><a href="contact.html">Contact</a>
</nav>
</header>
<main>
<section class="hero">
<span class="tag">Learning · Effort · Progress</span>
<h1>Our Achievements</h1>
<p>Celebrating the hard work, progress and proud milestones of our academy community.</p>
</section>
<div id="achievementState" class="state" role="status">Loading achievements…</div>
<div id="achievementCards" class="cards" aria-live="polite"></div>
</main>
<footer>© 2026 First Step Academy · Learn. Practise. Grow.</footer>
<script>
const client = window.supabase.createClient(
  'https://zbpneflfiykvlbeolpht.supabase.co',
  'sb_publishable_-bPtNntI8dUA3hzElAtETA_4Zkqa082'
);
const state = document.getElementById('achievementState');
const cards = document.getElementById('achievementCards');
const safe = value => String(value ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
(async function loadAchievements(){
  const {data,error}=await client.from('student_achievements')
    .select('id,title,description,achievement_date')
    .eq('published',true)
    .order('achievement_date',{ascending:false});
  if(error){
    state.textContent='Achievements are temporarily unavailable. Please visit again later.';
    return;
  }
  if(!data || !data.length){
    state.textContent='Achievements will appear here as the academy publishes them.';
    return;
  }
  state.hidden=true;
  cards.innerHTML=data.map(item=>'<article class="card"><div class="date">'+safe(item.achievement_date)+'</div><h2>'+safe(item.title)+'</h2><p>'+safe(item.description || 'A proud milestone from First Step Academy.')+'</p></article>').join('');
})();
</script>
</body>
</html>
