<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="First Step Academy — tuition, spoken English and student support.">
<title>First Step Academy | Learn. Practise. Grow.</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--navy:#142b4a;--teal:#20a596;--ink:#243247;--muted:#65758a;--paper:#f5f8fb;--line:#e3ebf1}*{box-sizing:border-box}body{margin:0;font:16px/1.6 Arial,sans-serif;color:var(--ink)}a{text-decoration:none;color:inherit}.wrap{width:min(1100px,92%);margin:auto}header{background:#fff;border-bottom:1px solid var(--line)}.nav{min-height:70px;display:flex;align-items:center;justify-content:space-between;gap:15px}.brand{font-weight:900;color:var(--navy)}.logo{display:inline-grid;place-items:center;background:var(--teal);color:white;width:38px;height:38px;border-radius:11px;margin-right:8px}.links{display:flex;gap:18px;font-weight:700;font-size:.9rem}.hero{background:linear-gradient(120deg,#f3f7fb,#eaf7f4);padding:65px 0}.heroGrid{display:grid;grid-template-columns:1.2fr .8fr;gap:25px;align-items:center}h1{font-size:clamp(2.4rem,5vw,4rem);line-height:1.08;color:var(--navy);margin:15px 0}h1 span{color:var(--teal)}.hero p,.muted{color:var(--muted)}.art,.dark{background:var(--navy);color:white;border-radius:22px;padding:30px}.art{text-align:center;font-size:1.3rem}.tag{color:#147c71;font-weight:900;letter-spacing:1px;text-transform:uppercase;font-size:.78rem}section{padding:55px 0}.head{text-align:center;margin:0 auto 28px;max-width:680px}.head h2{color:var(--navy);font-size:2rem;margin:8px}.cards,.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card,.panel{background:white;border:1px solid var(--line);border-radius:17px;padding:22px}.card h3{color:var(--navy)}.portal{background:var(--paper)}.panel{max-width:900px;margin:16px auto}.btn{border:0;border-radius:25px;background:var(--teal);color:white;padding:11px 18px;font-weight:800;cursor:pointer}.btn.secondary{background:var(--navy)}.btn.light{background:#e8f5f2;color:#126d63}.field label{display:block;font-size:.84rem;font-weight:800;color:var(--navy);margin-bottom:4px}.field input,.field select,.field textarea{width:100%;padding:11px;border:1px solid #d7e1e9;border-radius:9px;font:inherit;background:#fff}.fields{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.field.full{grid-column:1/-1}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.tabs button{border:1px solid var(--line);border-radius:22px;background:#fff;padding:9px 14px;font-weight:700;color:var(--navy);cursor:pointer}.tabs button.active{background:var(--navy);color:white}.hidden{display:none!important}.notice{padding:12px;border-radius:10px;background:#edf7f5;color:#155e56;margin:12px 0}.error{background:#fff0ee;color:#a02b20}.tableWrap{overflow:auto}table{width:100%;border-collapse:collapse;margin-top:12px}td,th{text-align:left;padding:9px;border-bottom:1px solid var(--line);font-size:.9rem}th{color:var(--navy)}.stat{background:#edf7f5;padding:15px;border-radius:12px}.stat b{font-size:1.5rem;color:var(--navy);display:block}footer{background:#10233c;color:#d4deea;padding:24px 0;margin-top:35px}.row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
@media(max-width:720px){.links{gap:10px;font-size:.78rem}.nav{padding:10px 0;flex-wrap:wrap}.heroGrid,.cards,.grid,.fields{grid-template-columns:1fr}.field.full{grid-column:auto}section{padding:42px 0}}
</style>
</head>
<body>
<header> <div class="wrap nav">
    <a class="brand" href="index.html">
      <span class="logo">F</span>FIRST STEP ACADEMY
    </a>
    <nav class="links">
      <a href="index.html">Home</a>
      <a href="courses.html">Courses</a>
      <a href="about.html">About</a>
      <a href="achievements.html">Achievements</a>
      <a href="gallery.html">Gallery</a>
      <a href="contact.html">Contact</a>
    </nav>
  </div></header>
<main>
<section class="portal" id="portal"><style>
.portal {
  min-height: 85vh;
  display: flex;
  align-items: center;
}
.portal .wrap {
  width: min(900px, 92%);
}
.portal .head {
  margin-bottom: 15px;
}
.portal .panel {
  margin: 10px auto;
}
</style></section>
</main><footer><div class="wrap row"><b>FIRST STEP ACADEMY · Learn. Practise. Grow.</b><span>© <span id="year"></span> First Step Academy</span></div></footer>
<script>
const SUPABASE_URL='https://zbpneflfiykvlbeolpht.supabase.co';
const SUPABASE_ANON_KEY='sb_publishable_-bPtNntI8dUA3hzElAtETA_4Zkqa082';
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
const $=id=>document.getElementById(id), today=new Date().toLocaleDateString('en-CA');
$('year').textContent=new Date().getFullYear();['adDate','staffDate','classDate'].forEach(id=>$(id).value=today);
let user=null,profile=null,rosterRows=[];
function msg(id,text,bad=false){$(id).innerHTML='<div class="notice '+(bad?'error':'')+'">'+text+'</div>'}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function showTable(target,headers,rows){$(target).innerHTML='<div class="tableWrap"><table><thead><tr>'+headers.map(x=>'<th>'+x+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+r.map(x=>'<td>'+esc(x)+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>'}
$('loginBtn').onclick=async()=>{const email=$('email').value.trim(),password=$('password').value;if(!email||!password)return msg('loginMsg','Enter your email and password.',true);$('loginBtn').disabled=true;const {data,error}=await db.auth.signInWithPassword({email,password});$('loginBtn').disabled=false;if(error)return msg('loginMsg',error.message,true);user=data.user;await loadDashboard()};
$('logoutBtn').onclick=async()=>{await db.auth.signOut();user=null;profile=null;$('dashboard').classList.add('hidden');$('loginPanel').classList.remove('hidden');$('email').value='';$('password').value=''};
async function loadDashboard(){const {data,error}=await db.from('profiles').select('*').eq('id',user.id).single();if(error||!data){msg('loginMsg','Login succeeded, but no academy profile is linked to this account. Ask the admin to check the profiles table.',true);await db.auth.signOut();return}profile=data;$('loginPanel').classList.add('hidden');$('dashboard').classList.remove('hidden');$('welcome').textContent='Welcome, '+data.full_name;$('roleLabel').textContent=data.role.toUpperCase();['adminDash','staffDash','studentDash'].forEach(id=>$(id).classList.add('hidden'));if(data.role==='admin'){ $('adminDash').classList.remove('hidden');await loadAdmin()}else if(data.role==='staff'){ $('staffDash').classList.remove('hidden');await loadStaff()}else if(data.role==='student'){ $('studentDash').classList.remove('hidden');await loadStudent()}else msg('dashMsg','Unknown account role.',true)}
async function loadAdmin(){const {data:staff}=await db.from('profiles').select('id,full_name,login_id').eq('role','staff').order('full_name');for(const id of ['staffSelect','assignStaff'])$(id).innerHTML=(staff||[]).map(s=>'<option value="'+s.id+'">'+esc(s.full_name)+' ('+esc(s.login_id)+')</option>').join('');const {data:students,error}=await db.from('students').select('student_code,full_name,class_name,guardian_name,guardian_phone,active').order('full_name');if(error)msg('dashMsg',error.message,true);else showTable('studentsTable',['Code','Student','Class','Guardian','Contact','Active'],(students||[]).map(s=>[s.student_code,s.full_name,s.class_name,s.guardian_name,s.guardian_phone,s.active?'Yes':'No']));const {data:att}=await db.from('staff_attendance').select('attendance_date,status,staff_id').order('attendance_date',{ascending:false}).limit(50);const staffMap=Object.fromEntries((staff||[]).map(s=>[s.id,s.full_name]));showTable('staffRecords',['Date','Staff','Status'],(att||[]).map(a=>[a.attendance_date,staffMap[a.staff_id]||a.staff_id,a.status]));const {data:as}=await db.from('staff_class_assignments').select('staff_id,class_name');showTable('assignRecords',['Staff','Class'],(as||[]).map(a=>[staffMap[a.staff_id]||a.staff_id,a.class_name]))}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x===b));['admissions','staffAttendance','studentsList','assignments'].forEach(id=>$(id).classList.toggle('hidden',id!==b.dataset.tab))});
$('adSave').onclick=async()=>{const name=$('adName').value.trim(),code=$('adCode').value.trim(),cls=$('adClass').value;if(!name||!code||!cls)return msg('dashMsg','Student name, student code and class are required.',true);const subjects=$('adSubjects').value.split(',').map(x=>x.trim()).filter(Boolean);const row={full_name:name,student_code:code,class_name:cls,date_of_birth:$('adDob').value||null,guardian_name:$('adGuardian').value.trim()||null,guardian_phone:$('adPhone').value.trim()||null,address:$('adAddress').value.trim()||null,subjects,admission_date:$('adDate').value||today,previous_school:$('adPrevious').value.trim()||null};const {error}=await db.from('students').insert(row);if(error)msg('dashMsg',error.message,true);else{msg('dashMsg','Admission saved successfully.');['adName','adCode','adDob','adGuardian','adPhone','adSubjects','adAddress','adPrevious'].forEach(id=>$(id).value='');await loadAdmin()}};
$('staffSave').onclick=async()=>{const staffId=$('staffSelect').value;if(!staffId)return msg('dashMsg','No staff profiles found. Create staff accounts and profiles first.',true);const {error}=await db.from('staff_attendance').upsert({staff_id:staffId,attendance_date:$('staffDate').value,status:$('staffStatus').value,marked_by:user.id},{onConflict:'staff_id,attendance_date'});if(error)msg('dashMsg',error.message,true);else{msg('dashMsg','Staff attendance saved.');await loadAdmin()}};
$('assignSave').onclick=async()=>{const {error}=await db.from('staff_class_assignments').upsert({staff_id:$('assignStaff').value,class_name:$('assignClass').value});if(error)msg('dashMsg',error.message,true);else{msg('dashMsg','Class assigned successfully.');await loadAdmin()}};
async function loadStaff(){const {data,error}=await db.from('staff_class_assignments').select('class_name').eq('staff_id',user.id);if(error)return msg('dashMsg',error.message,true);const classes=(data||[]).map(x=>x.class_name);$('myClasses').textContent=classes.length?classes.join(' · '):'No classes assigned yet. Please contact the admin.';$('classSelect').innerHTML=classes.map(c=>'<option>'+esc(c)+'</option>').join('')}
$('loadRoster').onclick=async()=>{const cls=$('classSelect').value;if(!cls)return msg('dashMsg','No assigned class available.',true);const {data,error}=await db.from('student_roster').select('student_id,full_name,class_name').eq('class_name',cls).eq('active',true).order('full_name');if(error)return msg('dashMsg',error.message,true);rosterRows=data||[];$('roster').innerHTML=rosterRows.length?rosterRows.map((s,i)=>'<div class="row" style="padding:9px;border-bottom:1px solid #e3ebf1"><span>'+esc(s.full_name)+'</span><select data-student="'+s.student_id+'" aria-label="Attendance for '+esc(s.full_name)+'"><option>Present</option><option>Absent</option><option>Leave</option></select></div>').join(''):'No active students in this class.'};
$('saveRoster').onclick=async()=>{if(!rosterRows.length)return msg('dashMsg','Load the class roster first.',true);const date=$('classDate').value,cls=$('classSelect').value;const rows=rosterRows.map(s=>({student_id:s.student_id,class_name:cls,attendance_date:date,status:$('roster').querySelector('[data-student="'+s.student_id+'"]').value,marked_by:user.id}));const {error}=await db.from('attendance').upsert(rows,{onConflict:'student_id,attendance_date'});if(error)msg('dashMsg',error.message,true);else msg('dashMsg','Student attendance saved successfully.')}
async function loadStudent(){const {data:s,error}=await db.from('students').select('id,student_code,class_name').eq('auth_user_id',user.id).single();if(error||!s)return msg('dashMsg','Your student record is not linked yet. Please contact the admin.',true);const {data:rows,error:e}=await db.from('attendance').select('attendance_date,status').eq('student_id',s.id).order('attendance_date',{ascending:false});if(e)return msg('dashMsg',e.message,true);const all=rows||[],present=all.filter(x=>x.status==='Present').length,absent=all.filter(x=>x.status==='Absent').length,leave=all.filter(x=>x.status==='Leave').length,total=all.length,pct=total?Math.round(present/total*100):0;$('studentSummary').innerHTML=[['Working days recorded',total],['Present',present],['Absent',absent],['Attendance %',pct+'%']].map(x=>'<div class="stat"><span>'+x[0]+'</span><b>'+x[1]+'</b></div>').join('');showTable('myAttendance',['Date','Status'],all.map(x=>[x.attendance_date,x.status]))}
db.auth.getSession().then(({data})=>{if(data.session){user=data.session.user;loadDashboard()}});
</script>
</body></html>
